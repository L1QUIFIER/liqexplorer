<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- liqfile: serves raw file bytes to the preview pane (img/media/embed only;
       text previews come over IPC, never as a document). object-src/frame-src
       are what let Chromium's built-in PDF viewer load a liqfile:// URL. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' liqicon: liqthumb:; img-src 'self' liqicon: liqthumb: liqfile: data:; media-src 'self' liqfile: liqplay: blob:; object-src 'self' liqfile:; frame-src 'self' liqfile:; style-src 'self' 'unsafe-inline'">
  <title>LiqExplorer</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/chrome.css">
  <link rel="stylesheet" href="styles/views.css">
  <link rel="stylesheet" href="styles/home.css">
  <link rel="stylesheet" href="styles/nav.css">
  <link rel="stylesheet" href="styles/menus.css">
  <link rel="stylesheet" href="styles/dialogs.css">
  <link rel="stylesheet" href="styles/options.css">
  <link rel="stylesheet" href="styles/fixnames.css">
  <link rel="stylesheet" href="styles/duplicates.css">
  <link rel="stylesheet" href="styles/betterimage.css">
  <link rel="stylesheet" href="styles/similar.css">
  <link rel="stylesheet" href="styles/preview.css">
  <link rel="stylesheet" href="styles/pickbar.css">
  <!-- last: pane rules override the single-pane boxes in base.css / home.css -->
  <link rel="stylesheet" href="styles/panes.css">
</head>
<body>
  <div id="app">
    <div id="titlebar"></div>
    <div id="navrow"></div>
    <div id="commandbar"></div>
    <div id="main">
      <div id="navpane"></div>
      <div id="navpane-splitter"></div>
      <!-- dual pane: pane 0 keeps the original #viewhost / #homehost ids so
           every existing rule still targets it; pane 1 is hidden until split -->
      <div id="panes">
        <div class="pn-pane pn-active" data-pane="0">
          <div id="viewhost" class="pn-view"></div>
          <div id="homehost" class="pn-home" hidden></div>
        </div>
        <div id="pane-splitter" hidden></div>
        <div class="pn-pane" data-pane="1" hidden>
          <div class="pn-view"></div>
          <div class="pn-home" hidden></div>
        </div>
      </div>
      <div id="sidepane-splitter" hidden></div>
      <div id="sidepane" hidden></div>
    </div>
    <div id="statusbar"></div>
    <!-- file-picker mode only (chrome/pickbar.ts); an ordinary window never
         un-hides it, so the layout below the status bar is unchanged -->
    <div id="pickbar" hidden></div>
  </div>
  <div id="menu-layer"></div>
  <div id="dialog-layer"></div>
  <div id="ops-flyout"></div>
  <script src="index.js"></script>
</body>
</html>
