<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Same policy as the main page, minus what this window never does: no
       listings, no drag and drop, no dialogs. media-src/object-src/frame-src
       are what let <video> and Chromium's PDF viewer read liqfile:// URLs. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' liqicon: liqthumb:; img-src 'self' liqicon: liqthumb: liqfile: data:; media-src 'self' liqfile: liqplay: blob:; object-src 'self' liqfile:; frame-src 'self' liqfile:; style-src 'self' 'unsafe-inline'">
  <title>Media</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/media.css">
</head>
<body class="mv-popout-body">
  <div id="mv-root" class="mv-window" tabindex="-1"></div>
  <script src="popout.js"></script>
</body>
</html>
